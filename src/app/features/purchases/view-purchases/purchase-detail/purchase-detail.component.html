<div class="row h-100 g-3">
    <!-- Sidebar -->
    <div class="col-12 col-md-4 col-lg-3 col-xl-3">
        <app-purchase-sidebar [selectedTab]="selectedTab()" [purchase]="purchase" (tabChange)="selectTab($event)"
            (receive)="onReceive()" (cancel)="onInvalidate()">
        </app-purchase-sidebar>
    </div>

    <!-- Main Content -->
    <div class="col-12 col-md-8 col-lg-9 col-xl-9">
        <div class="d-flex flex-column main h-100">
            <!-- Toolbar -->
            <app-document-toolbar [selectedFormat]="selectedFormat()" (formatChange)="onFormatChange($event)"
                (print)="onPrint()" (download)="onDownload()" (share)="onShare()">
            </app-document-toolbar>

            <!-- Voucher Preview -->
            <app-purchase-voucher-preview [purchase]="purchase" [selectedFormat]="selectedFormat()"></app-purchase-voucher-preview>
        </div>
    </div>
</div>
