<app-confirm-modal></app-confirm-modal>
<app-modal-alert></app-modal-alert>
<app-spinner [show]="isLoading()" [fullScreen]="true"></app-spinner>

<div class="module-header">
    <app-module-header title="Ver Compras" iconClass="bi-bag"></app-module-header>
</div>

<div style="margin: 20px 12px;">
    <div class="card border shadow-sm mb-4">
        <div class="card-body p-3">
            <app-date-range-search (filterChange)="handleDateFilter($event)"></app-date-range-search>
        </div>
    </div>

    <!-- Purchases Summary -->
    <app-summary-cards title="RESUMEN" [items]="summaryItems()">
    </app-summary-cards>

    <app-purchase-list [purchases]="purchases()" [isLoading]="isLoading()" [totalItems]="totalItems()"
        [totalPages]="totalPages()" [currentPage]="currentPage()" [pageSize]="pageSize()"
        (pageChange)="handlePageChange($event)" (pageSizeChange)="handlePageSizeChange($event)"
        (tableFilterChange)="handleTableFilter($event)" (viewDetail)="onViewDetails($event)"
        (cancelPurchase)="onCancelPurchase($event)">
    </app-purchase-list>
</div>

<!-- Purchase Detail Modal -->
<app-modal-generic [title]="'Detalle de Compra'" [isVisible]="isDetailVisible()" [size]="'xl'"
    (close)="isDetailVisible.set(false)">
    <app-purchase-detail *ngIf="selectedPurchase()" [purchase]="selectedPurchase()" (actionSuccess)="loadPurchases()"
        (cancel)="onCancelPurchase($event)" (close)="isDetailVisible.set(false)">
    </app-purchase-detail>
</app-modal-generic>
