<div class="roles-list-container animate-fade-in position-relative">


    <div class="card border-0 shadow-sm overflow-hidden">
        <app-custom-table [columns]="cols" [data]="roles" [pageSize]="pageSize" [totalElements]="totalItems"
            [currentPage]="currentPage" (onPageChange)="onPageChange($event)" (onFilterChange)="onFilterChange($event)"
            (onAction)="handleTableAction($event)">
        </app-custom-table>

        <div *ngIf="isLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>

</div>
