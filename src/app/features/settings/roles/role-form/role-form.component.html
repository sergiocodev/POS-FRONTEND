<div class="role-form-container animate-fade-in">
    <!-- Spinner -->
    <div *ngIf="isLoading()" class="d-flex flex-column align-items-center justify-content-center py-5 min-vh-50">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <span class="text-muted fw-medium tracking-wide">CARGANDO DATOS...</span>
    </div>

    <ng-container *ngIf="!isLoading()">
        <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="premium-form">
            <div class="d-flex justify-content-end mb-3 gap-2">
                <button type="submit" class="btn-new-role" [disabled]="isSaving() || roleForm.invalid">
                    <span *ngIf="isSaving()" class="spinner-border spinner-border-sm me-2" role="status"></span>
                    <i *ngIf="!isSaving()" class="bi bi-check2-all me-2"></i>
                    {{ isEditMode() ? 'Actualizar' : 'Crear' }} Rol
                </button>
            </div>

            <div class="row g-4">
                <div class="col-12">
                    <div class="premium-card">
                        <div class="card-body-sleek">
                            <div class="row g-4">
                                <div class="col-12">
                                    <div class="form-group">
                                        <label class="premium-label">Nombre del Rol <span class="text-danger">*</span></label>
                                        <div class="input-group-premium" [class.is-invalid-premium]="f['name'].invalid && f['name'].touched">
                                            <div class="input-icon"><i class="bi bi-shield-lock"></i></div>
                                            <input type="text" class="form-control premium-input" formControlName="name" placeholder="Ej: Administrador, Vendedor, etc.">
                                        </div>
                                        <div class="premium-error" *ngIf="f['name'].invalid && f['name'].touched">
                                            <i class="bi bi-exclamation-circle-fill"></i>
                                            <span *ngIf="f['name'].errors?.['required']"> El nombre es requerido.</span>
                                            <span *ngIf="f['name'].errors?.['minlength']"> Mínimo 3 caracteres.</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-group">
                                        <label class="premium-label d-flex justify-content-between align-items-center">
                                            <span>Descripción</span>
                                            <span class="premium-hint-inline bg-light px-2 py-1 rounded text-muted">(Opcional)</span>
                                        </label>
                                        <div class="input-group-premium textarea-group">
                                            <div class="input-icon"><i class="bi bi-card-text"></i></div>
                                            <textarea class="form-control premium-input" formControlName="description" rows="3" placeholder="Describe las responsabilidades y alcance de este rol..."></textarea>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </ng-container>
</div>
