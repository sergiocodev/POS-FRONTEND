<app-confirm-modal></app-confirm-modal>
<app-modal-alert></app-modal-alert>
<app-spinner [show]="isLoading()" [fullScreen]="true"></app-spinner>
<app-module-header title="Establecimientos" iconClass="bi bi-shop"></app-module-header>

<div class="establishments-wrapper animate-fade-in">
    <div class="d-flex justify-content-end">
        <button type="button" class="btn-new-establishment" (click)="onOpenForm()">Nuevo Establecimiento</button>
    </div>

    <app-establishments-list [establishments]="establishments()" [isLoading]="isLoading()" [totalItems]="totalItems()"
        [totalPages]="totalPages()" [currentPage]="currentPage()" [pageSize]="pageSize()" (edit)="onOpenForm($event)"
        (delete)="onDeleteEstablishment($event)" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"
        (tableFilterChange)="onTableFilter($event)">
    </app-establishments-list>

    <!-- Modal para Crear/Editar Establecimiento -->
    <app-modal-generic [isVisible]="displayForm()"
        [title]="selectedEstablishmentId() ? 'Editar Establecimiento' : 'Nuevo Establecimiento'"
        (close)="onFormCancelled()">

        <app-establishment-form *ngIf="displayForm()" [establishmentId]="selectedEstablishmentId()"
            (saved)="onFormSaved()" (cancelled)="onFormCancelled()">
        </app-establishment-form>
    </app-modal-generic>
</div>
