<div
  class="aurora-container min-vh-100 d-flex align-items-center justify-content-center overflow-hidden position-relative">

  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <!-- Noise Overlay for texture -->
  <div class="noise-overlay"></div>

  <!-- Glass Card -->
  <div class="premium-glass-card">
    <div class="card-glow"></div>

    <div class="card-content p-4 p-md-5">

      <!-- Header -->
      <div class="text-center mb-4 staggered-item">
        <div class="logo-wrapper d-inline-block position-relative mb-4">
          <div class="logo-glow"></div>
          <img src="images/logos/loginlogosioc.png" alt="Siocdev Logo" class="brand-logo position-relative z-1">
        </div>
        <h3 class="fw-bold fs-4 text-white mb-2 tracking-tight">¡Qué bueno verte otra vez!</h3>
        <h3 class="fw-bold fs-3 text-white mb-2 tracking-tight">Bienvenido</h3>
        <p class="text-white-50 fw-light">Ingrese a su espacio de trabajo.</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

        <div class="premium-input-group mb-4 staggered-item">
          <div class="input-wrapper">
            <span class="icon-prefix">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" class="premium-input" id="username" placeholder="Usuario o Email"
              formControlName="usernameOrEmail" [class.is-invalid]="isInvalid('usernameOrEmail')">
            <label for="username" class="premium-label">Usuario o Email</label>
            <div class="input-border"></div>
          </div>
          <div class="invalid-feedback premium-feedback" *ngIf="isInvalid('usernameOrEmail')">
            El usuario es requerido.
          </div>
        </div>

        <div class="premium-input-group mb-4 staggered-item">
          <div class="input-wrapper">
            <span class="icon-prefix">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input [type]="showPassword() ? 'text' : 'password'" class="premium-input pe-5" id="password"
              placeholder="Contraseña" formControlName="password" [class.is-invalid]="isInvalid('password')">
            <label for="password" class="premium-label">Contraseña</label>
            <button class="btn password-toggle text-white-50" type="button" (click)="togglePassword()">
              <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
            <div class="input-border"></div>
          </div>
          <div class="invalid-feedback premium-feedback" *ngIf="isInvalid('password')">
            Mínimo 4 caracteres requeridos.
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 staggered-item">
          <label class="premium-checkbox-wrapper">
            <input type="checkbox" class="premium-checkbox-input">
            <span class="premium-checkbox-box"></span>
            <span class="text-white-50 small fw-medium ms-2">Recordar acceso</span>
          </label>
          <a href="#" class="premium-link small fw-medium">Recuperar clave</a>
        </div>

        <div *ngIf="errorMessage()" class="premium-alert d-flex align-items-center p-3 mb-4 staggered-item">
          <div class="alert-icon-wrapper me-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <div class="small fw-medium">{{ errorMessage() }}</div>
        </div>

        <button type="submit" class="premium-btn w-100 staggered-item" [disabled]="loginForm.invalid || isLoading()">
          <span class="btn-bg"></span>
          <span class="btn-content">
            <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2" role="status"
              aria-hidden="true"></span>
            <span class="fw-semibold tracking-wide" *ngIf="!isLoading()">INGRESAR AL SISTEMA</span>
            <svg *ngIf="!isLoading()" class="ms-2 arrow-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </button>

      </form>
    </div>
  </div>
</div>
